name: Temporary billing dependency lock update
on:
  push:
    branches:
      - feature/billing-invoices-mcp
    paths:
      - package.json
permissions:
  contents: write
jobs:
  lock:
    if: github.repository == 'Neuroklast/neuroklast-band-land'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/billing-invoices-mcp
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Resolve lockfile from npm with standard tooling
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore(billing): lock verified e-invoice dependency'
            git push origin HEAD:feature/billing-invoices-mcp
          fi
