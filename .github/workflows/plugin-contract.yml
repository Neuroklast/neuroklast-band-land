name: Plugin commerce contract
on:
  push:
    branches: ['codex/neurokore-licensing']
  pull_request:
    paths:
      - 'lib/neurokore/**'
      - 'lib/plugins/**'
      - 'app/**/neurokore/**'
      - 'app/**/plugins/**'
      - 'app/api/license/**'
      - 'supabase/schema.sql'
      - 'supabase/tests/plugin.sql'
      - 'supabase/tests/mcp-content.sql'
      - 'src/test/neurokore*'
      - 'src/test/plugin*'
      - '.github/workflows/plugin-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: license_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test
      PGDATABASE: license_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: >-
          npx eslint lib/neurokore lib/plugins app/neurokore app/plugins
          app/api/neurokore app/api/plugins app/api/license
          'app/admin/(protected)/plugins' src/test/neurokore*.test.ts src/test/plugin*.test.ts
      - run: npx vitest run src/test/neurokore-protocol.test.ts src/test/neurokore-stripe.test.ts src/test/plugin-releases.test.ts src/test/plugin-download-route.test.ts
      - name: Disposable Supabase role and auth fixtures
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon;
          CREATE ROLE authenticated;
          CREATE ROLE service_role;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users(id uuid PRIMARY KEY);
          -- Minimal auth fixtures for consent-bound OAuth MCP session checks.
          CREATE TABLE auth.oauth_clients(id uuid PRIMARY KEY);
          CREATE TABLE auth.oauth_consents(
            id uuid PRIMARY KEY, user_id uuid REFERENCES auth.users(id),
            client_id uuid REFERENCES auth.oauth_clients(id), revoked_at timestamptz
          );
          CREATE TABLE auth.sessions(
            id uuid PRIMARY KEY, user_id uuid REFERENCES auth.users(id),
            oauth_client_id uuid REFERENCES auth.oauth_clients(id),
            aal text, factor_id uuid
          );
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $ SELECT NULL::uuid $;
          SQL
      - run: psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/mcp-content.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/plugin.sql
      - run: node supabase/tests/plugin-concurrency.mjs
      - name: Reset public schema for the migration path
        run: psql -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
      - name: Seed the pre-migration NEUROKORE schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/plugin-legacy.sql
      - name: Apply the schema to legacy data, twice, to prove idempotency
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
      - name: Assert legacy data survived and was backfilled
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/plugin-migration.sql
