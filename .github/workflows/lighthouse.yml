name: Mobile Lighthouse budgets

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lighthouse.yml'
      - '.lighthouserc.cjs'
      - 'app/**'
      - 'components/**'
      - 'contexts/**'
      - 'hooks/**'
      - 'layouts/**'
      - 'lib/**'
      - 'public/**'
      - 'styles/**'
      - 'next.config.mjs'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Install mobile browser
        run: npx playwright install --with-deps chromium
      - name: Mobile layout and reduced-motion smoke
        run: npx playwright test e2e/mobile.spec.ts --project=mobile-chromium
      - name: Verify local production server
        run: |
          npm run start -- --hostname 127.0.0.1 >/tmp/nk-next-start.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          healthy=0
          for attempt in $(seq 1 30); do
            if curl --noproxy '*' --fail --silent --show-error --max-time 5               http://127.0.0.1:3000/ -o /dev/null; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            cat /tmp/nk-next-start.log
            exit 1
          fi
      - name: Lighthouse mobile collection and budgets
        run: |
          npm install -g @lhci/cli@0.15.1
          lhci autorun --config=.lighthouserc.cjs
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-mobile-reports
          path: |
            lighthouse-reports/
            .lighthouseci/
          retention-days: 14
          if-no-files-found: ignore
